<div class="skills-selection">
  <h3>Select Your Skills</h3>

  <!-- Search / Add -->
  <div class="skill-search">
    <input
      type="text"
      [(ngModel)]="searchQuery"
      placeholder="Search skills or add your own..."
      (keydown.enter)="submitSearch()"
    />
    <button type="button" (click)="submitSearch()">
      {{ searchQuery.trim() && !hasExactMatch() ? 'Add' : 'Go' }}
    </button>
  </div>
  <p class="search-hint" *ngIf="searchQuery.trim() && !hasExactMatch()">
    Press Enter to add "{{ searchQuery.trim() }}" as a new skill
  </p>

  <!-- Suggested from CV content -->
  <div class="skill-category suggested" *ngIf="detectedSkills.length">
    <h4>Suggested from your CV</h4>
    <div class="skills-tags">
      <span
        *ngFor="let skill of detectedSkills"
        [class.selected]="isSelected(skill)"
        class="detected"
        title="Found in your CV content"
        (click)="toggleSkill(skill)">
        {{ skill }}
      </span>
    </div>
  </div>

  <!-- Categorized dictionary -->
  <div class="skill-category" *ngFor="let category of filteredCategories()">
    <h4>{{ category.name }}</h4>
    <div class="skills-tags">
      <span
        *ngFor="let skill of category.skills"
        [class.selected]="isSelected(skill)"
        [class.detected]="isDetected(skill)"
        [title]="isDetected(skill) ? 'Found in your CV content' : ''"
        (click)="toggleSkill(skill)">
        {{ skill }}
      </span>
    </div>
  </div>
</div>
<div class="selectLanguages">
  <h3>Select CV Languages</h3>
  <label>
    <input type="checkbox" [(ngModel)]="selectedLanguages.de" (change)="onLanguageChange()"> German
  </label>
  <label>
    <input type="checkbox" [(ngModel)]="selectedLanguages.en" (change)="onLanguageChange()"> English
  </label>
</div>
<div>
  <button (click)="emitDownloadPdf()">Download PDF</button>
</div>
